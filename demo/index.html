<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>danmu.js + Video.js</title>
    <link
      href="https://vjs.zencdn.net/8.23.4/video-js.css"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #f5f6f8;
        color: #1f2937;
      }

      .page {
        width: min(960px, 100%);
        margin: 0 auto;
      }

      .player-wrap {
        position: relative;
        overflow: hidden;
        background: #000;
      }

      #danmu {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        color: #000;
        font-size: 16px;
      }

      #danmu > div {
        pointer-events: auto;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }

      .setting {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-top: 10px;
      }

      input,
      select {
        min-width: 90px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        padding: 8px;
        background: #fff;
      }

      button {
        border: 1px solid #d1d5db;
        border-radius: 6px;
        padding: 8px 12px;
        background: #fff;
        cursor: pointer;
      }

      button:hover {
        background: #f3f4f6;
      }

      #status {
        margin-top: 12px;
        color: #6b7280;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>danmu.js + Video.js</h1>
      <div class="player-wrap">
        <video
          id="videojs-player"
          class="video-js vjs-default-skin"
          controls
          playsinline
          preload="auto"
          width="960"
          height="540"
        >
          <source
            src="//s1.pstatp.com/cdn/expire-1-M/byted-player-videos/1.0.0/xgplayer-demo.mp4"
            type="video/mp4"
          />
          您的浏览器不支持 HTML5 视频播放。
        </video>
        <div id="danmu" aria-label="弹幕区域"></div>
      </div>

      <div class="controls">
        <button type="button" id="danmu-start">开始弹幕</button>
        <button type="button" id="danmu-pause">暂停弹幕</button>
        <button type="button" id="danmu-play">继续弹幕</button>
        <button type="button" id="danmu-stop">停止弹幕</button>
        <button type="button" id="danmu-send">发送实时弹幕</button>
        <button type="button" id="danmu-burst">发送 100 条弹幕</button>
      </div>
      <div class="setting">
        <input id="comment-text" value="Video.js 实时弹幕" />
        <button type="button" id="danmu-comment">发送弹幕</button>
        <button type="button" id="danmu-prior">发送优先弹幕</button>
      </div>
      <div class="setting">
        <input id="opacity" type="number" min="0" max="1" step="0.1" value="1" />
        <button type="button" id="set-opacity">设置透明度</button>
        <input id="font-size" type="number" min="10" max="64" value="16" />
        <button type="button" id="set-font-size">设置字体大小</button>
        <input id="duration" type="number" min="1000" value="10000" />
        <button type="button" id="set-duration">设置滚动时长</button>
      </div>
      <div class="setting">
        <input id="area-start" type="number" min="0" max="1" step="0.05" value="0.02" />
        <input id="area-end" type="number" min="0" max="1" step="0.05" value="0.98" />
        <button type="button" id="set-area">设置弹幕区域</button>
        <select id="hide-type">
          <option value="scroll">滚动弹幕</option>
          <option value="top">顶部弹幕</option>
          <option value="bottom">底部弹幕</option>
          <option value="color">彩色弹幕</option>
        </select>
        <button type="button" id="hide-danmu">隐藏</button>
        <button type="button" id="show-danmu">显示</button>
      </div>
      <div id="status">正在初始化 Video.js…</div>
    </main>

    <script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>
    <script type="module">
      import DanmuJs from '../browser/index.mjs'

      const status = document.querySelector('#status')
      const container = document.querySelector('#danmu')
      const videoElement = document.querySelector('#videojs-player')
      const player = window.videojs(videoElement)

      // Keep the danmu layer inside Video.js's fullscreen element.
      player.el().appendChild(container)

      const formatTimestamp = (milliseconds) => {
        const totalSeconds = Math.floor(milliseconds / 1000)
        const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0')
        const seconds = String(totalSeconds % 60).padStart(2, '0')
        return `${minutes}:${seconds}`
      }
      const textSeed = '弹幕测试视频播放效果观察滚动全屏暂停继续随机文字'
      const randomText = () => {
        const length = 4 + Math.floor(Math.random() * 12)
        return Array.from({ length }, () => {
          return textSeed[Math.floor(Math.random() * textSeed.length)]
        }).join('')
      }
      const defaultStarts = Array.from(
        { length: 1000 },
        () => Math.random() * 60000
      ).sort((left, right) => left - right)
      defaultStarts[0] = 0
      defaultStarts[defaultStarts.length - 1] = 60000
      const defaultComments = defaultStarts.map((start, index) => {
        return {
          id: `default-${index}`,
          start,
          duration: 9000,
          txt: `${formatTimestamp(start)} ${randomText()}`
        }
      })

      const danmu = new DanmuJs({
        container,
        player: videoElement,
        mouseControl: true,
        mouseControlPause: true,
        area: {
          start: 0.02,
          end: 0.98
        },
        comments: defaultComments
      })

      let nextId = 1
      let danmuStarted = false

      function updateStatus(message) {
        status.textContent = `${message} · ${player.currentTime().toFixed(1)}s`
      }

      danmu.on('ready', () => updateStatus('danmu.js 已就绪'))
      danmu.on('bullet_start', () => updateStatus('弹幕播放中'))
      danmu.on('bullet_hover', ({ bullet }) => {
        console.log('hover bullet:', bullet)
        danmu.freezeComment(bullet.id)
        window.setTimeout(() => danmu.restartComment(bullet.id), 4000)
      })

      document.querySelector('#danmu-start').addEventListener('click', () => {
        danmu.start()
        danmuStarted = true
        updateStatus('弹幕已开始')
      })
      document.querySelector('#danmu-pause').addEventListener('click', () => {
        danmu.pause()
        updateStatus('弹幕已暂停')
      })
      document.querySelector('#danmu-play').addEventListener('click', () => {
        danmu.play()
        updateStatus('弹幕已继续')
      })
      document.querySelector('#danmu-stop').addEventListener('click', () => {
        danmu.stop()
        updateStatus('弹幕已停止')
      })
      document.querySelector('#danmu-send').addEventListener('click', () => {
        const id = `realtime-${nextId++}`
        danmu.sendComment({
          id,
          start: player.currentTime() * 1000,
          duration: 8000,
          realTime: true,
          txt: `实时弹幕 ${id}`,
          style: {
            color: '#000'
          }
        })
        updateStatus('已发送实时弹幕')
      })
      document.querySelector('#danmu-burst').addEventListener('click', () => {
        const start = player.currentTime() * 1000
        const textSeed = '批量弹幕测试海浪风景视频ABCDEFGHIJKLMNOPQRSTUVWXYZ'
        for (let index = 0; index < 100; index++) {
          const length = 6 + Math.floor(Math.random() * 30)
          const text = Array.from({ length }, (_, charIndex) => {
            return textSeed[(index + charIndex) % textSeed.length]
          }).join('')

          danmu.sendComment({
            id: `burst-${nextId++}`,
            // Spread the burst over 30 seconds instead of displaying all
            // comments in the same scheduler tick.
            start: start + index * 300,
            duration: 10000,
            txt: text,
            style: {
              color: '#000'
            }
          })
        }
        updateStatus('已发送 100 条弹幕')
      })
      document.querySelector('#danmu-comment').addEventListener('click', () => {
        const id = `comment-${nextId++}`
        danmu.sendComment({
          id,
          start: player.currentTime() * 1000,
          duration: 8000,
          realTime: true,
          txt: document.querySelector('#comment-text').value || '实时弹幕',
          style: {
            color: '#000'
          }
        })
        updateStatus('已发送弹幕')
      })
      document.querySelector('#danmu-prior').addEventListener('click', () => {
        const id = `prior-${nextId++}`
        danmu.sendComment({
          id,
          start: player.currentTime() * 1000,
          duration: 5000,
          realTime: true,
          prior: true,
          noDiscard: true,
          txt: '优先弹幕：Video.js 测试',
          style: {
            color: '#000',
            border: '1px solid #f00'
          }
        })
        updateStatus('已发送优先弹幕')
      })
      document.querySelector('#set-opacity').addEventListener('click', () => {
        danmu.setOpacity(document.querySelector('#opacity').value)
        updateStatus('已更新透明度')
      })
      document.querySelector('#set-font-size').addEventListener('click', () => {
        const size = Number(document.querySelector('#font-size').value)
        if (Number.isFinite(size) && size > 0) {
          danmu.setFontSize(size, size + 4)
          updateStatus('已更新字体大小')
        }
      })
      document.querySelector('#set-duration').addEventListener('click', () => {
        const duration = Number(document.querySelector('#duration').value)
        if (Number.isFinite(duration) && duration > 0) {
          danmu.setAllDuration('scroll', duration)
          updateStatus('已更新滚动时长')
        }
      })
      document.querySelector('#set-area').addEventListener('click', () => {
        const start = Number(document.querySelector('#area-start').value)
        const end = Number(document.querySelector('#area-end').value)
        if (Number.isFinite(start) && Number.isFinite(end) && end >= start) {
          danmu.setArea({ start, end })
          updateStatus('已更新弹幕区域')
        }
      })
      document.querySelector('#hide-danmu').addEventListener('click', () => {
        danmu.hide(document.querySelector('#hide-type').value)
        updateStatus('已隐藏弹幕类型')
      })
      document.querySelector('#show-danmu').addEventListener('click', () => {
        danmu.show(document.querySelector('#hide-type').value)
        updateStatus('已显示弹幕类型')
      })

      player.on('play', () => {
        if (!danmuStarted) {
          danmu.start()
          danmuStarted = true
        } else {
          danmu.play()
        }
      })
      player.on('pause', () => danmu.pause())
      player.on('ended', () => danmu.stop())
    </script>
  </body>
</html>
